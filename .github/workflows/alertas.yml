{"name": "Alertas Stocks in Play", "on": {"schedule": [{"cron": "*/10 6-23 * * 1-5"}], "workflow_dispatch": {"inputs": {"prueba": {"description": "Mandar un mensaje de prueba a Telegram", "type": "boolean", "default": true}}}}, "concurrency": {"group": "alertas", "cancel-in-progress": false}, "jobs": {"alertas": {"runs-on": "ubuntu-latest", "timeout-minutes": 8, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12", "cache": "pip", "cache-dependency-path": "requirements_nube.txt"}}, {"name": "Instalar librerias", "run": "pip install -q -r requirements_nube.txt"}, {"name": "Recuperar estado", "uses": "actions/cache/restore@v4", "with": {"path": "estado", "key": "estado-${{ github.run_id }}", "restore-keys": "estado-"}}, {"name": "Revisar el mercado y mandar alertas", "run": "python nube.py", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}", "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}", "FINNHUB_KEY": "${{ secrets.FINNHUB_KEY }}", "PRUEBA": "${{ github.event.inputs.prueba }}", "TZ": "Europe/Madrid"}}, {"name": "Guardar estado", "if": "always()", "uses": "actions/cache/save@v4", "with": {"path": "estado", "key": "estado-${{ github.run_id }}"}}]}}}
